# 《百乐门最后一支舞》· 三幕分支版
# 说明：剧本不写目标值；检定目标 = 角色技能值（D-05）。
# 流程：舞池 → 后台 / 经理室 / 后巷 → 化妆间 / 舞台 → 暗房对峙 → 三种结局。
id: paramount_last_dance
version: 0.1.0
title: 百乐门最后一支舞
subtitle: 1935 · 上海静安寺路 · 悬疑 / 社交
minutes: 25-35
rating: 16+
party_max: 5
opening: |
  1935 年深秋，百乐门。乐队刚换过谱，舞池里的灯还亮着，歌女白露却没有上台。
  后台的门从里面反锁，化妆镜前留着一道没擦净的痕迹。
  帘子后面有人影，桌上怀表合着，椅背搭着一条披肩。

content_scope:
  era: 1935 年秋 · 上海静安寺路百乐门
  genre: 悬疑 / 社交 / 黑色电影
  rating: 16+
  allowed: [谈判, 试探, 欺骗, 潜入, 威胁, 有限的暴力]
  forbidden: [性内容, 未成年人伤害, 虐待细节, 真实人物影射, 现代科技, 出戏元话语]
  intent: 玩家应在剧本的时空与题材内行事

cast:
  - id: human
    kind: human
    name: Joe
    goal: 找出白露失踪的真相
    tags: [话术, 心理学, 记者]
  - id: bp_yan
    kind: bp
    name: 严少
    goal: 维持家族名声，别让白露的事见报
    secret: 他给白露写过一封退婚书
    tags: [体面, 酒量好, 心虚]
    quip: 舞跳错了可以重来，话不是说。
    switch_trigger: 被点到家族名声时，他会先撇清自己。
  - id: bp_ling
    kind: bp
    name: 小铃
    goal: 替白露唱完今晚的最后一支舞
    secret: 她偷了白露的日记
    tags: [怯场, 机灵, 忠诚]
    quip: 白露姐说，麦克风比男人可靠。
    switch_trigger: 有人答应让她唱完，她就会冒险。
  - id: bp_zhou
    kind: bp
    name: 周经理
    goal: 把这件事压在后台上，别影响生意
    secret: 他欠了黑帮一笔钱
    tags: [圆滑, 怕事, 算计]
    quip: 百乐门开门做生意，不做公道。
    switch_trigger: 一提到查账或黑帮，他先想关门。

npcs:
  - id: npc_lu
    name: 陆探长
    goal: 尽快结案，别把租界警局牵进来
    secret: 他与白露有旧
    tags: [疲惫, 敏锐, 护短]

scenes:
  - id: lobby
    name: 舞池
    goal: 找到白露失踪的第一条线索
    clocks:
      - id: band
        label: 乐队的耐心
        max: 5
        on_zero: backstage
    clues:
      - id: clue_lipstick
        text: 镜子上用口红写着一个被擦掉一半的名字
      - id: clue_reserved_table
        text: 角落的预留桌上有两只杯子，一只没动过
      - id: clue_torn_glove
        text: 楼梯口落着一只被撕开的手套
    exits:
      - id: backstage
        to: backstage
        when: 'flag:backstage_pass || clue:clue_lipstick'
      - id: office
        to: office
        when: 'flag:manager_talk'
      - id: alley
        to: alley
        when: 'flag:side_door'
      - id: dance_floor
        to: backstage
        when: 'always'
      - id: band_stops
        to: backstage
        when: 'clock_zero:band'
    checks:
      - skill: 侦查
        difficulty: regular
        stakes: 你只看见口红印，还没看清那个名字
      - skill: 心理学
        difficulty: regular
        stakes: 你看出有人在装镇定，但看不出是谁
      - skill: 话术
        difficulty: regular
        stakes: 侍者不肯多说，但没去叫经理
      - skill: 聆听
        difficulty: regular
        stakes: 后台传来关门声，随即又静了

  - id: backstage
    name: 后台
    goal: 进化妆间，或问出白露最后一次上台前见了谁
    clocks:
      - id: show
        label: 下一场开演
        max: 4
        on_zero: dressing_room
    clues:
      - id: clue_locked_door
        text: 化妆间的门从里面反锁，锁眼却是新的
      - id: clue_perfume
        text: 空气里有一股不属于白露的檀香味
      - id: clue_cue_sheet
        text: 节目单上最后一支舞被人改成了「安可」
    exits:
      - id: dressing
        to: dressing_room
        when: 'flag:door_open'
      - id: office
        to: office
        when: 'always'
      - id: lobby
        to: lobby
        when: 'always'
      - id: show_must_go
        to: dressing_room
        when: 'clock_zero:show'
    checks:
      - skill: 侦查
        difficulty: regular
        stakes: 你只看见锁眼的新痕，门还关着
      - skill: 聆听
        difficulty: regular
        stakes: 门里有人挪动椅子，随后又停了
      - skill: 妙手
        difficulty: regular
        stakes: 发夹断在锁里，门反而更紧了
      - skill: 话术
        difficulty: regular
        stakes: 小铃低下头，但没走开

  - id: dressing_room
    name: 化妆间
    goal: 找到白露留下的东西，弄明白她为什么没上台
    clocks:
      - id: someone_coming
        label: 走廊里的脚步
        max: 4
        on_zero: confrontation
    clues:
      - id: clue_diary
        text: 日记最后一行写着「今晚把账还给他」
      - id: clue_train_ticket
        text: 一张去南京的夜车票，时间是今晚十一点
      - id: clue_second_lipstick
        text: 镜背还有一行口红字：「别信穿灰西装的人」
    exits:
      - id: office
        to: office
        when: 'flag:manager_talk'
      - id: stage
        to: stage
        when: 'flag:go_on_stage'
      - id: lobby
        to: lobby
        when: 'always'
      - id: footsteps
        to: confrontation
        when: 'clock_zero:someone_coming'
    checks:
      - skill: 侦查
        difficulty: regular
        stakes: 你只翻到一张空白的日记页，还能再找
      - skill: 心理学
        difficulty: regular
        stakes: 你看不出日记被谁动过，但粉盒还是温的
      - skill: 妙手
        difficulty: regular
        stakes: 你碰倒了香水瓶，走廊里的脚步停了一下
      - skill: 图书馆
        difficulty: regular
        stakes: 你认出车票的班次，却不知道谁买的

  - id: office
    name: 经理室
    goal: 查清周经理欠了谁的钱，以及白露为什么被卷进来
    clocks:
      - id: books
        label: 周经理的账
        max: 4
        on_zero: confrontation
    clues:
      - id: clue_debt_ledger
        text: 账本上有一笔用白露的包银抵的债
      - id: clue_phone_message
        text: 电话记录写着「十点，暗房，带人」
      - id: clue_photo
        text: 相框里周经理和白露站得很近，中间隔着一个人
    exits:
      - id: confront
        to: confrontation
        when: 'clue:clue_debt_ledger || flag:confront_zhou'
      - id: lobby
        to: lobby
        when: 'always'
      - id: books_close
        to: confrontation
        when: 'clock_zero:books'
    checks:
      - skill: 话术
        difficulty: regular
        stakes: 他开始绕圈子，但还没叫巡捕
      - skill: 心理学
        difficulty: regular
        stakes: 你看不出他怕什么，但他一直挡着抽屉
      - skill: 侦查
        difficulty: regular
        stakes: 你只看到账本一角，还能再找机会
      - skill: 妙手
        difficulty: hard
        stakes: 抽屉开了，印章却滚到地上

  - id: alley
    name: 后巷
    goal: 找到从后门离开的白露，或找到看见她的人
    clocks:
      - id: rain
        label: 冷雨
        max: 4
        on_zero: stage
    clues:
      - id: clue_earring
        text: 水洼里有一只白露常戴的耳环
      - id: clue_taxi
        text: 巷口停着一辆没熄火的出租车
      - id: clue_cigarette
        text: 墙边有一枚还在烧的烟蒂，印着百乐门的标记
    exits:
      - id: office
        to: office
        when: 'always'
      - id: stage
        to: stage
        when: 'flag:stage_route'
      - id: confront
        to: confrontation
        when: 'clue:clue_earring'
      - id: rain_forces
        to: stage
        when: 'clock_zero:rain'
    checks:
      - skill: 侦查
        difficulty: regular
        stakes: 你只看见耳环的反光，没看见巷口的人
      - skill: 潜行
        difficulty: regular
        stakes: 你踩进一摊水，出租车灯灭了
      - skill: 聆听
        difficulty: regular
        stakes: 你听见后门有人低声说话，但听不清
      - skill: 话术
        difficulty: regular
        stakes: 司机摇头，但没把车窗关死

  - id: stage
    name: 舞台
    goal: 在最后一支舞结束前，让知情的人开口
    clocks:
      - id: final_dance
        label: 最后一支舞
        max: 4
        on_zero: confrontation
    clues:
      - id: clue_note
        text: 钢琴凳下压着一张白露写的字条：「他来了」
      - id: clue_spotlight
        text: 追光每隔一会儿就往暗房门口扫
      - id: clue_audience
        text: 台下第三排坐着一个一直不鼓掌的人
    exits:
      - id: confront
        to: confrontation
        when: 'clue:clue_note || flag:expose_yan'
      - id: lobby
        to: lobby
        when: 'always'
      - id: dance_ends
        to: confrontation
        when: 'clock_zero:final_dance'
    checks:
      - skill: 侦查
        difficulty: regular
        stakes: 你只看见字条的一角，还能再翻
      - skill: 聆听
        difficulty: regular
        stakes: 你听见后台有人在争执，但听不清名字
      - skill: 话术
        difficulty: regular
        stakes: 小铃握紧了话筒，但没有走
      - skill: 心理学
        difficulty: regular
        stakes: 你看出台下有人不对劲，却说不清哪里

  - id: confrontation
    name: 暗房
    goal: 在白露的事见报前决定：揭穿、救人，还是让最后一支舞照常跳完
    clocks:
      - id: flash
        label: 闪光灯
        max: 4
        on_zero: ending_silence
    clues:
      - id: clue_confession
        text: 严少承认退婚书是他写的，但他没有动白露
      - id: clue_real_debt
        text: 周经理把白露的包银拿去抵了黑帮的债
      - id: clue_back_door
        text: 暗房后面有一条通往舞台的道
    exits:
      - id: truth
        to: ending_truth
        when: 'flag:expose_truth'
      - id: escape
        to: ending_escape
        when: 'flag:save_bailu'
      - id: silence
        to: ending_silence
        when: 'clock_zero:flash'
      - id: stalemate
        to: ending_silence
        when: 'always'
    checks:
      - skill: 话术
        difficulty: hard
        stakes: 他把话说圆了，但还没有人离开
        on_fumble:
          ending: ending_silence
          text: 闪光灯亮起时，所有人都退开一步。你成了今晚唯一的新闻。
      - skill: 心理学
        difficulty: regular
        stakes: 你看清一个人在撒谎，却拿不出证据
      - skill: 侦查
        difficulty: regular
        stakes: 你看见后门，但闪光灯正对着你
      - attribute: 敏捷
        difficulty: regular
        stakes: 你躲开砸来的相机，暗房里更黑了

  - id: ending_truth
    name: 谢幕
    ending: true
    goal: 让最后一支舞在所有人面前跳完

  - id: ending_escape
    name: 夜车
    ending: true
    goal: 赶在十一点前把白露送上离开上海的夜车

  - id: ending_silence
    name: 熄灯
    ending: true
    goal: 让百乐门明晚照常开门
